services:
  db:
    image: postgres:15-alpine
    container_name: hr_db
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  backend:
    build: ./packages/backend
    container_name: hr_backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
    ports:
      - "3000:3000"

volumes:
  pgdata:
